name: mocha
description: "A Flutter app for generated brown noise and audio playback."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_soloud: ^2.1.2
  audio_service: ^0.18.17
  audio_session: ^0.1.21
  audio_metadata_reader: ^1.2.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  desktop_drop: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
